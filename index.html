/* Cards */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); }

<script>
(function () {

// ---- logic/util.js ----
// Small shared helpers. Pure functions only.

const APP_TITLE = 'Reseller Tax Tracker';

function round2(n) {
  const x = Number(n) || 0;
  return Math.round((x + Math.sign(x) * 1e-9) * 100) / 100;
}

function toNum(v) {
  if (typeof v === 'number') return isFinite(v) ? v : 0;
  if (v == null) return 0;
  const s = String(v).trim().replace(/[^\d,.\-]/g, '');
  if (!s) return 0;
  // Accept "12,50" as 12.50 and "1,234.50" as 1234.50
  let t = s;
  if (t.includes(',') && !t.includes('.')) t = t.replace(',', '.');
  else t = t.replace(/,/g, '');
  const n = parseFloat(t);
  return isFinite(n) ? n : 0;

function pad(n, w = 2) { return String(n).padStart(w, '0'); }

function isoDate(d) {
  return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
}

function todayISO(now = new Date()) { return isoDate(now); }

function parseISO(s) {
  if (!s) return null;
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s);
  if (!m) return null;
  return new Date(+m[1], +m[2] - 1, +m[3], 12, 0, 0);
}

function addDays(iso, n) {
  const d = parseISO(iso);
  d.setDate(d.getDate() + n);
  return isoDate(d);
}

function daysBetween(aISO, bISO) {
  const a = parseISO(aISO), b = parseISO(bISO);
  if (!a || !b) return null;
  return Math.round((b - a) / 86400000);
}

function uid() {
  const r = (typeof crypto !== 'undefined' && crypto.getRandomValues)
    ? Array.from(crypto.getRandomValues(new Uint8Array(8)), b => b.toString(16).padStart(2, '0')).join('')
    : Math.random().toString(16).slice(2) + Math.random().toString(16).slice(2);
  return Date.now().toString(36) + '-' + r.slice(0, 12);
}

function itemCode(n) { return 'RT-' + pad(n, 4); }

function sum(arr, f = x => x) { return round2(arr.reduce((t, x) => t + (Number(f(x)) || 0), 0)); }

function inRange(iso, range) { return !!iso && iso >= range.start && iso <= range.end; }

// ---- logic/calc.js ----
// Money maths for one item. Pure functions.

function calcFee(soldPrice, shippingCharged, preset) {
  if (!preset || preset.payer === 'buyer') return 0;
  const price = Number(soldPrice) || 0;
  if (price <= 0) return 0;
  if (preset.flatUnder && price < preset.flatUnder) return round2(preset.flatFee || 0);
  const base = price + (Number(shippingCharged) || 0);
  return round2(base * (Number(preset.pct) || 0) / 100 + (Number(preset.fixed) || 0));
}

// Split a haul total equally across n items, in cents, so the parts always add up.
function splitCost(total, n) {
  if (n <= 0) return [];
  const cents = Math.round((Number(total) || 0) * 100);
  const each = Math.floor(cents / n);
  let rem = cents - each * n;
  const out = [];
  for (let i = 0; i < n; i++) {
    let c = each;
    if (rem > 0) { c += 1; rem -= 1; }
    out.push(c / 100);
  }
  return out;
}

// After she edits one share, spread the difference across the items she has not touched.
function rebalance(total, shares, lockedIdx) {
  const locked = new Set(lockedIdx);
  const lockedSum = shares.reduce((t, s, i) => t + (locked.has(i) ? s : 0), 0);
  const free = shares.map((_, i) => i).filter(i => !locked.has(i));
  if (!free.length) return shares.slice();
  const parts = splitCost(Math.max(0, round2(total - lockedSum)), free.length);
  const out = shares.slice();
  free.forEach((i, k) => { out[i] = parts[k]; });
  return out;
}

function saleFee(item, settings) {
  const s = item.sale;
  if (!s) return 0;
  if (s.feeManual) return round2(s.fee);
  const preset = settings && settings.fees ? settings.fees[s.platform] : null;
  return calcFee(s.price, s.shippingCharged, preset);
}

// Money she received after fees and the postage she paid.
function moneyIn(item, settings) {
  const s = item.sale;
  if (!s) return 0;
  return round2((Number(s.price) || 0) + (Number(s.shippingCharged) || 0) - saleFee(item, settings) - (Number(s.postagePaid) || 0));
}

function profit(item, settings) {
  if (item.kind === 'wardrobe' || !item.sale) return null;
  return round2(moneyIn(item, settings) - (Number(item.cost) || 0));
}

function returnOnCost(item, settings) {
  const p = profit(item, settings);
  const c = Number(item.cost) || 0;
  if (p == null || c <= 0) return null;
  return Math.round((p / c) * 1000) / 10; // percent, one decimal
}

function daysToSell(item) {
  if (!item.sale || !item.boughtAt) return null;
  return daysBetween(item.boughtAt, item.sale.date);
}

function daysListed(item, today = todayISO()) {
  if (!item.listedAt) return null;
  return daysBetween(item.listedAt, item.sale ? item.sale.date : today);
}

function isStale(item, staleDays = 60, today = todayISO()) {
  if (item.status !== 'listed') return false;
  const d = daysListed(item, today);
  return d != null && d > staleDays;
}

// "Should I buy it?": the most she can pay and still make her target profit.
function maxBuyPrice(expectedPrice, preset, postage, targetProfit) {
  const fee = calcFee(expectedPrice, 0, preset);
  return round2(Math.max(0, (Number(expectedPrice) || 0) - fee - (Number(postage) || 0) - (Number(targetProfit) || 0)));
}

function profitAtPrice(expectedPrice, preset, postage, buyPrice) {
  return round2((Number(expectedPrice) || 0) - calcFee(expectedPrice, 0, preset) - (Number(postage) || 0) - (Number(buyPrice) || 0));
}

// ---- logic/tax.js ----
// Reporting limits, tax years and year-end totals. Pure functions.



// ---- Reporting limits ----
// logic 'either': reported when EITHER limit is reached (EU, Ireland, UK).
// logic 'both': reported only when BOTH are passed (US federal 1099-K).
// strict: true means "more than" the limit (US); false means "reaches" it (EU/UK).
function reportStatus(sales, amount, limits) {
  const L = limits || { sales: 30, amount: 2000, logic: 'either', strict: false };
  const salesPct = L.sales > 0 ? sales / L.sales : 0;
  const amountPct = L.amount > 0 ? amount / L.amount : 0;
  const hit = (v, lim) => (L.strict ? v > lim : v >= lim);
  const salesHit = hit(sales, L.sales);
  const amountHit = hit(amount, L.amount);
  const reached = L.logic === 'both' ? (salesHit && amountHit) : (salesHit || amountHit);
  const close = !reached && Math.max(salesPct, amountPct) >= 0.8;
  return {
    status: reached ? 'reached' : close ? 'close' : 'below',
    label: reached ? 'Limit reached' : close ? 'Getting close' : 'Below limit',
    salesPct, amountPct, salesHit, amountHit,
  };
}

// ---- Tax years ----
function calendarRange(year) {
  return { start: year + '-01-01', end: year + '-12-31', label: String(year), year };
}

function taxYearRange(mode, year) {
  if (mode === 'uk') {
    return { start: year + '-04-06', end: (year + 1) + '-04-05', label: year + '/' + pad((year + 1) % 100), year };
  }
  return calendarRange(year);
}

function taxYearOf(mode, iso) {
  const y = +iso.slice(0, 4);
  if (mode === 'uk') return iso.slice(5) >= '04-06' ? y : y - 1;
  return y;
}

// ---- Totals ----
const liveRecs = arr => (arr || []).filter(x => !x.deleted);
const sold = it => it.sale && it.status === 'sold';
const gross = it => round2((Number(it.sale.price) || 0) + (Number(it.sale.shippingCharged) || 0));

// Per platform, for one calendar year: what the platform sees and what she made.
function platformYear(items, settings, year) {
  const range = calendarRange(year);
  const rows = {};
  for (const it of liveRecs(items)) {
    if (!sold(it) || !inRange(it.sale.date, range)) continue;
    const p = it.sale.platform || 'other';
    const r = rows[p] || (rows[p] = {
      platform: p, count: 0, total: 0,
      wardrobe: { count: 0, total: 0 },
      flips: { count: 0, total: 0, cost: 0, fees: 0, postage: 0, profit: 0 },
    });
    const g = gross(it);
    r.count++; r.total = round2(r.total + g);
    if (it.kind === 'wardrobe') {
      r.wardrobe.count++; r.wardrobe.total = round2(r.wardrobe.total + g);
    } else {
      const f = r.flips;
      f.count++;
      f.total = round2(f.total + g);
      f.cost = round2(f.cost + (Number(it.cost) || 0));
      f.fees = round2(f.fees + saleFee(it, settings));
      f.postage = round2(f.postage + (Number(it.sale.postagePaid) || 0));
      f.profit = round2(f.profit + profit(it, settings));
    }
  }
  return Object.values(rows)
    .map(r => ({ ...r, report: reportStatus(r.count, r.total, settings.limits) }))
    .sort((a, b) => b.count - a.count || b.total - a.total);
}

function yearSummary(state, range) {
  const settings = state.settings;
  const items = liveRecs(state.items);
  const flipsSold = items.filter(it => it.kind !== 'wardrobe' && sold(it) && inRange(it.sale.date, range));
  const wardSold = items.filter(it => it.kind === 'wardrobe' && sold(it) && inRange(it.sale.date, range));
  const expenses = liveRecs(state.expenses).filter(e => inRange(e.date, range));
  const mileage = liveRecs(state.mileage).filter(m => inRange(m.date, range));

  const sales = sum(flipsSold, gross);
  const cogs = sum(flipsSold, it => it.cost);
  const fees = sum(flipsSold, it => saleFee(it, settings));
  const postage = sum(flipsSold, it => it.sale.postagePaid);
  const byCat = EXPENSE_CATEGORIES.map(c => ({ id: c.id, name: c.name, total: sum(expenses.filter(e => (e.category || 'other') === c.id), e => e.amount) }));
  const otherExpenses = sum(expenses, e => e.amount);
  const mileageAmount = sum(mileage, m => m.amount);
  const mileageDistance = sum(mileage, m => m.distance);
  const totalExpenses = round2(cogs + fees + postage + otherExpenses + mileageAmount);
  const profitTotal = round2(sales - totalExpenses);
  const unsold = items.filter(it => it.kind !== 'wardrobe' && it.boughtAt && it.boughtAt <= range.end
    && !(it.status === 'kept' || it.status === 'donated')
    && !(sold(it) && it.sale.date <= range.end));
  const unsoldCost = sum(unsold, it => it.cost);

  return {
    range,
    flips: { count: flipsSold.length, sales, cogs, fees, postage, otherExpenses, byCat, mileageAmount, mileageDistance, totalExpenses, profit: profitTotal },
    wardrobe: { count: wardSold.length, total: sum(wardSold, gross) },
    unsold: { count: unsold.length, cost: unsoldCost },
    ukAllowance: { allowance: 1000, actual: totalExpenses, better: totalExpenses >= 1000 ? 'actual' : 'allowance' },
  };
}

function monthProfit(items, settings, ym) {
  return sum(liveRecs(items).filter(it => it.kind !== 'wardrobe' && sold(it) && it.sale.date.slice(0, 7) === ym), it => profit(it, settings));
}

// ---- logic/backup.js ----
// Backup file: build, check, preview and merge. Pure functions.

const BACKUP_FORMAT = 'reseller-tax-tracker-backup';

function makeBackup(state, now = new Date()) {
  return {
    format: BACKUP_FORMAT, version: 1, savedAt: now.toISOString(),
    settings: state.settings, items: state.items || [], expenses: state.expenses || [], mileage: state.mileage || [],
    nextCode: state.nextCode || 1,
  };
}

function readBackup(text) {
  let data;
  try { data = JSON.parse(text); } catch (e) { return { ok: false, error: 'This file isn’t a backup from this app. Look for a file that ends in .json and starts with “reseller-tax-tracker”.' }; }
  if (!data || data.format !== BACKUP_FORMAT || !Array.isArray(data.items)) {
    return { ok: false, error: 'This file isn’t a backup from this app. Look for a file that ends in .json and starts with “reseller-tax-tracker”.' };
  }
  return { ok: true, data };
}

function lastChanged(data) {
  let t = '';
  for (const k of ['items', 'expenses', 'mileage']) for (const r of data[k] || []) if (r.updatedAt && r.updatedAt > t) t = r.updatedAt;
  return t || data.savedAt || '';
}

function previewBackup(data) {
  const items = (data.items || []).filter(i => !i.deleted);
  return {
    items: items.length,
    sold: items.filter(i => i.status === 'sold').length,
    expenses: (data.expenses || []).filter(i => !i.deleted).length,
    mileage: (data.mileage || []).filter(i => !i.deleted).length,
    lastChanged: lastChanged(data),
  };
}

// Merge two lists of records by id. The newest change wins. Deletions are kept as markers so they travel too.
function mergeList(a = [], b = []) {
  const map = new Map();
  for (const r of a) map.set(r.id, r);
  for (const r of b) {
    const cur = map.get(r.id);
    if (!cur || (r.updatedAt || '') > (cur.updatedAt || '')) map.set(r.id, r);
  }
  return Array.from(map.values());
}

function mergeStates(current, incoming) {
  const items = mergeList(current.items, incoming.items);
  const maxCode = items.reduce((m, i) => Math.max(m, parseInt(String(i.code || '').replace(/\D/g, ''), 10) || 0), 0);
  return {
    ...current,
    items,
    expenses: mergeList(current.expenses, incoming.expenses),
    mileage: mergeList(current.mileage, incoming.mileage),
    nextCode: Math.max(current.nextCode || 1, incoming.nextCode || 1, maxCode + 1),
  };
}

// ---- logic/xlsx.js ----
// A tiny .xlsx and .csv writer. Store-only ZIP with CRC32. No libraries.

const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1;
    t[n] = c >>> 0;
  }
  return t;
})();

function crc32(bytes) {
  let c = 0xFFFFFFFF;
  for (let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}

const enc = s => new TextEncoder().encode(s);

// files: [{ name, data: string | Uint8Array }]
function zipStore(files, date = new Date(2026, 0, 1)) {
  const dosTime = (date.getHours() << 11) | (date.getMinutes() << 5) | (date.getSeconds() >> 1);
  const dosDate = ((date.getFullYear() - 1980) << 9) | ((date.getMonth() + 1) << 5) | date.getDate();
  const locals = [], centrals = [];
  let offset = 0;
  for (const f of files) {
    const name = enc(f.name);
    const data = typeof f.data === 'string' ? enc(f.data) : f.data;
    const crc = crc32(data);
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true); lh.setUint16(8, 0, true);
    lh.setUint16(10, dosTime, true); lh.setUint16(12, dosDate, true); lh.setUint32(14, crc, true);
    lh.setUint32(18, data.length, true); lh.setUint32(22, data.length, true); lh.setUint16(26, name.length, true); lh.setUint16(28, 0, true);
    locals.push(new Uint8Array(lh.buffer), name, data);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true); ch.setUint16(10, 0, true);
    ch.setUint16(12, dosTime, true); ch.setUint16(14, dosDate, true); ch.setUint32(16, crc, true);
    ch.setUint32(20, data.length, true); ch.setUint32(24, data.length, true); ch.setUint16(28, name.length, true);
    ch.setUint16(30, 0, true); ch.setUint16(32, 0, true); ch.setUint16(34, 0, true); ch.setUint16(36, 0, true); ch.setUint32(38, 0, true);
    ch.setUint32(42, offset, true);
    centrals.push(new Uint8Array(ch.buffer), name);
    offset += 30 + name.length + data.length;
  }
  const cdSize = centrals.reduce((t, a) => t + a.length, 0);
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true); end.setUint16(8, files.length, true); end.setUint16(10, files.length, true);
  end.setUint32(12, cdSize, true); end.setUint32(16, offset, true);
  const parts = [...locals, ...centrals, new Uint8Array(end.buffer)];
  const out = new Uint8Array(parts.reduce((t, a) => t + a.length, 0));
  let p = 0;
  for (const a of parts) { out.set(a, p); p += a.length; }
  return out;
}

const xmlEsc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))
  // Strip characters that are not allowed in XML.
  .replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, '');

function colName(i) {
  let s = '';
  i++;
  while (i > 0) { const m = (i - 1) % 26; s = String.fromCharCode(65 + m) + s; i = Math.floor((i - 1) / 26); }
  return s;
}

function sheetXml(rows, widths) {
  const cols = widths && widths.length
    ? '<cols>' + widths.map((w, i) => `<col min="${i + 1}" max="${i + 1}" width="${w}" customWidth="1"/>`).join('') + '</cols>'
    : '';
  const body = rows.map((row, r) => {
    const cells = row.map((v, c) => {
      const ref = colName(c) + (r + 1);
      const style = r === 0 ? ' s="1"' : '';
      if (v == null || v === '') return '';
      if (typeof v === 'number' && isFinite(v)) return `<c r="${ref}" s="${r === 0 ? 1 : 2}"><v>${v}</v></c>`;
      return `<c r="${ref}" t="inlineStr"${style}><is><t xml:space="preserve">${xmlEsc(v)}</t></is></c>`;
    }).join('');
    return `<row r="${r + 1}">${cells}</row>`;
  }).join('');
  return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n'
    + '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">'
    + '<sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>'
    + cols + `<sheetData>${body}</sheetData></worksheet>`;
}

// sheets: [{ name, rows: [[...]], widths?: [..] }]
function makeXlsx(sheets) {
  const safe = n => n.replace(/[\\\/\?\*\[\]:]/g, ' ').slice(0, 31);

    + '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>'
    + sheets.map((s, i) => `<Override PartName="/xl/worksheets/sheet${i + 1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')
    + '</Types>' });

  files.push({ name: 'xl/_rels/workbook.xml.rels', data: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n'
    + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'

    + `<Relationship Id="rId${sheets.length + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>`
    + '</Relationships>' });
  files.push({ name: 'xl/styles.xml', data: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n'
    + '<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">'
    + '<numFmts count="1"><numFmt numFmtId="164" formatCode="#,##0.00"/></numFmts>'
    + '<fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts>'
    + '<fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills>'
    + '<borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders>'
    + '<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>'
    + '<cellXfs count="3"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>'
    + '<xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/>'
    + '<xf numFmtId="164" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/></cellXfs>'
    + '<cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles>'
    + '</styleSheet>' });
  sheets.forEach((s, i) => files.push({ name: `xl/worksheets/sheet${i + 1}.xml`, data: sheetXml(s.rows, s.widths) }));
  return zipStore(files);
}

function makeCsv(rows) {
  const cell = v => {
    if (v == null) return '';
    const s = String(v);
    // Stop spreadsheet apps treating text as a formula.
    const safe = /^[=+\-@]/.test(s) && typeof v !== 'number' ? "'" + s : s;
    return /[",\r\n]/.test(safe) ? '"' + safe.replace(/"/g, '""') + '"' : safe;
  };
  return '﻿' + rows.map(r => r.map(cell).join(',')).join('\r\n') + '\r\n';
}

// Two hauls: rows that share one price.
const HAULS = [
  { rows: [3, 5, 12, 18], total: 17, label: 'Bag of four' },
  { rows: [39, 40, 37], total: 21, label: 'Car boot lot' },
];

function makeSample(country = 'UK', today = todayISO()) {
  const settings = defaultSettings(country);
  const c = COUNTRIES[country] || COUNTRIES.US;
  const main = country === 'US' ? 'poshmark' : 'vinted';
  const third = country === 'US' ? 'mercari' : 'depop';
  const slots = [main, 'ebay', third, 'facebook'];
  settings.platforms = slots.slice();
  settings.onboarded = true;
  const sources = c.sources.slice(0, 4).concat(c.sources[c.sources.length - 1]);

  const haulOf = {};
  HAULS.forEach((h, hi) => {
    const parts = splitCost(h.total, h.rows.length);
    const ago = Math.max(...h.rows.map(r => ROWS[r][7]));
    h.rows.forEach((r, k) => { haulOf[r] = { id: 'haul-' + (hi + 1), cost: parts[k], label: country === 'US' && h.label === 'Car boot lot' ? 'Garage sale lot' : h.label, ago }; });
  });

  const stamp = d => d + 'T18:00:00.000Z';
  const agoOf = i => (haulOf[i] ? haulOf[i].ago : ROWS[i][7]);
  const order = ROWS.map((r, i) => i).sort((a, b) => agoOf(b) - agoOf(a) || a - b);
  const items = [];
  order.forEach((i, n) => {
    const [name, brand, category, size, kind, cost0, src, , out] = ROWS[i];
    const haul = haulOf[i];
    const ago = agoOf(i);
    const boughtAt = addDays(today, -ago);
    const it = {
      id: 'sample-' + (i + 1), code: itemCode(n + 1), name, brand, category, size, kind,
      cost: kind === 'wardrobe' ? 0 : (haul ? haul.cost : cost0),
      boughtAt, source: kind === 'wardrobe' ? sources[4] : sources[src],
      bin: kind === 'wardrobe' ? '' : 'Box ' + (1 + (n % 4)), notes: haul ? haul.label : '',
      haulId: haul ? haul.id : null,
      status: 'tolist', listedAt: null, listPlatform: null, listPrice: null, sale: null,
      createdAt: stamp(boughtAt), updatedAt: stamp(boughtAt), sample: true,
    };
    const platform = slots[out[0] === 'sold' ? out[1] : (n % 2 ? 1 : 0)];
    if (out[0] === 'sold' || out[0] === 'listed') {
      it.listedAt = addDays(boughtAt, out[0] === 'sold' ? out[3] : out[1]);
      it.listPlatform = platform;
      it.status = 'listed';
    }
    if (out[0] === 'sold') {
      const price = out[2];
      const soldAt = addDays(it.listedAt, out[4]);
      const pid = slots[out[1]];
      const post = pid === 'ebay' ? 3.6 : pid === third ? 3.2 : 0;
      const ship = pid === third ? 3.2 : 0;
      it.listPrice = round2(price * 1.15);
      it.status = 'sold';
      it.sale = { platform: pid, price, postagePaid: post, shippingCharged: ship, date: soldAt, fee: 0, feeManual: false };
      it.updatedAt = stamp(soldAt);
    } else if (out[0] === 'listed') {
      it.listPrice = round2(Math.max(10, (cost0 || 6) * 3.5));
      it.updatedAt = stamp(it.listedAt);
    } else if (out[0] === 'kept' || out[0] === 'donated') {
      it.status = out[0];
    }
    items.push(it);
  });

  const exp = (ago, what, amount, category) => ({ id: 'sample-e' + ago, date: addDays(today, -ago), what, amount, category, updatedAt: stamp(addDays(today, -ago)), sample: true });
  const expenses = [
    exp(280, 'Mailing bags, pack of 100', 9.99, 'packaging'),
    exp(240, 'Clothes rail', 24.5, 'equipment'),
    exp(200, 'Tissue paper and stickers', 6.4, 'packaging'),
    exp(150, 'Storage boxes x4', 16, 'storage'),
    exp(90, 'Phone tripod for photos', 12.99, 'equipment'),
    exp(30, 'Mailing bags, pack of 100', 9.99, 'packaging'),
  ];
  const unit = settings.distanceUnit, rate = settings.mileageRate;
  const trip = (ago, what, dist) => ({ id: 'sample-m' + ago, date: addDays(today, -ago), trip: what, distance: dist, unit, rate, amount: round2(dist * rate), updatedAt: stamp(addDays(today, -ago)), sample: true });
  const mileage = [
    trip(262, 'Car boot sale and back', unit === 'km' ? 24 : 15),
    trip(200, 'Charity shop run, three towns', unit === 'km' ? 38 : 24),
    trip(110, 'Car boot sale and back', unit === 'km' ? 24 : 15),
    trip(25, 'Charity shop run', unit === 'km' ? 18 : 11),
  ];
  return { settings, items, expenses, mileage, nextCode: items.length + 1, sample: true };
}

// ---- app/store.js ----
// Storage: IndexedDB first, localStorage if that fails, memory if both fail.
// Every call is wrapped so a storage problem never stops the app.

const DB_NAME = 'reseller-tax-tracker';
const KEY = 'state';
const LS_KEY = 'rtt-state';
const MARK = 'rtt-seen';

const Store = {
  mode: 'memory',
  db: null,
  demo: false,

  lsOk() {
    try { const k = '__rtt_t'; localStorage.setItem(k, '1'); localStorage.removeItem(k); return true; } catch (e) { return false; }
  },

  openDb() {
    return new Promise(resolve => {
      let done = false;
      const finish = v => { if (!done) { done = true; resolve(v); } };
      setTimeout(() => finish(null), 2500);
      try {
        if (!('indexedDB' in window) || !window.indexedDB) return finish(null);
        const req = indexedDB.open(DB_NAME, 1);
        req.onupgradeneeded = () => { try { req.result.createObjectStore('kv'); } catch (e) { /* ignore */ } };
        req.onsuccess = () => finish(req.result);
        req.onerror = () => finish(null);
        req.onblocked = () => finish(null);
      } catch (e) { finish(null); }
    });
  },

  idbGet() {
    return new Promise(resolve => {
      try {
        const tx = this.db.transaction('kv', 'readonly');
        const r = tx.objectStore('kv').get(KEY);
        r.onsuccess = () => resolve(r.result || null);
        r.onerror = () => resolve(null);
      } catch (e) { resolve(null); }
    });
  },

  idbPut(value) {
    return new Promise(resolve => {
      try {
        const tx = this.db.transaction('kv', 'readwrite');
        tx.objectStore('kv').put(value, KEY);
        tx.oncomplete = () => resolve(true);
        tx.onerror = () => resolve(false);
        tx.onabort = () => resolve(false);
      } catch (e) { resolve(false); }
    });
  },

  // Returns { state, status } where status is 'ok', 'new', 'cleared' or 'unavailable'.
  async init(demo) {
    this.demo = !!demo;
    if (demo) { this.mode = 'memory'; return { state: null, status: 'new' }; }
    const ls = this.lsOk();
    this.db = await this.openDb();
    let raw = null;
    if (this.db) {
      this.mode = 'idb';
      raw = await this.idbGet();
      if (!raw && ls) { // moved from the fallback store, or IndexedDB was cleared on its own
        try { raw = localStorage.getItem(LS_KEY); } catch (e) { raw = null; }
      }
    } else if (ls) {
      this.mode = 'local';
      try { raw = localStorage.getItem(LS_KEY); } catch (e) { raw = null; }
    } else {
      this.mode = 'memory';
      return { state: null, status: 'unavailable' };
    }
    let state = null;
    try { state = raw ? (typeof raw === 'string' ? JSON.parse(raw) : raw) : null; } catch (e) { state = null; }
    let seen = null;
    try { seen = JSON.parse(localStorage.getItem(MARK) || 'null'); } catch (e) { seen = null; }
    if (!state && seen && seen.items > 0) return { state: null, status: 'cleared', seen };
    if (!state) return { state: null, status: 'new' };
    if (navigator.storage && navigator.storage.persist && location.protocol !== 'file:') {
      try { navigator.storage.persist(); } catch (e) { /* ignore */ }
    }
    return { state, status: 'ok' };
  },

  async save(state) {
    if (this.demo || this.mode === 'memory') return true;
    const json = JSON.stringify(state);
    let ok = false;
    if (this.mode === 'idb' && this.db) ok = await this.idbPut(json);
    if (!ok) {
      try { localStorage.setItem(LS_KEY, json); ok = true; if (this.mode === 'idb') this.mode = 'local'; } catch (e) { ok = false; }
    } else {
      // Keep the small fallback copy out of the way once IndexedDB works.
      try { localStorage.removeItem(LS_KEY); } catch (e) { /* ignore */ }
    }
    try {
      const n = (state.items || []).filter(i => !i.deleted && !i.sample).length;
      localStorage.setItem(MARK, JSON.stringify({ items: n, at: new Date().toISOString() }));
    } catch (e) { /* ignore */ }
    return ok;
  },

  async wipe() {
    try { if (this.db) await this.idbPut(null); } catch (e) { /* ignore */ }
    try { localStorage.removeItem(LS_KEY); localStorage.removeItem(MARK); } catch (e) { /* ignore */ }
  },
};

// ---- Downloads and sharing ----
function downloadBlob(blob, filename) {
  try {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename; a.rel = 'noopener';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    return true;
  } catch (e) { toast('Your browser blocked the download. Try another browser.'); return false; }
}
async function shareOrDownload(blob, filename) {
  const coarse = window.matchMedia && matchMedia('(pointer: coarse)').matches;
  try {
    if (coarse && navigator.canShare && typeof File === 'function') {
      const file = new File([blob], filename, { type: blob.type });
      if (navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: filename });
        return 'shared';
      }
    }
  } catch (e) {
    if (e && e.name === 'AbortError') return 'cancelled';
  }
  return downloadBlob(blob, filename) ? 'downloaded' : 'failed';
}

  const p = profit(i, S.settings);
  let right = '';
  if (i.status === 'sold') {
    right = i.kind === 'wardrobe'
      ? `${money(moneyIn(i, S.settings))}<small>received</small>`
      : `<span class="${p < 0 ? 'neg' : 'pos'}">${money(p)}</span><small>profit</small>`;
  } else if (i.status === 'listed') {
    right = `${i.listPrice ? money(i.listPrice) : '—'}<small>${isStale(i, S.settings.staleDays) ? 'stale' : 'listed'}</small>`;
  } else if (i.status === 'tolist') {
    right = `${money(i.cost)}<small>to list</small>`;
  } else {
    right = `<small>${esc(statusName(i.status))}</small>`;
  }
  const meta = [i.kind === 'wardrobe' ? 'Wardrobe' : 'Flip', i.brand, i.bin].filter(Boolean).join(' · ');
  return `<li><a href="#/item/${encodeURIComponent(i.id)}"><div class="grow"><div class="name">${esc(i.name)}</div>
    <div class="meta"><span class="code">${esc(i.code)}</span> ${esc(meta)}</div></div><div class="amt num">${right}</div></a></li>`;
}

const VIEWS = {

      <section class="card hero" aria-labelledby="h-profit">

        <div class="big num">${money(mp)}</div>
        ${goal > 0 ? `${bar(mp / goal, '', 'Progress to monthly goal')}<div class="small muted">${mp >= goal ? 'Goal reached. Nice work.' : money(Math.max(0, goal - mp)) + ' to your goal of ' + money(goal, { whole: true })}</div>` : ''}

      <div class="kpis">

        <a class="kpi" href="#/stale"><div class="v num">${stale}</div><div class="l">Stale, listed over ${s.staleDays} days</div></a>
        <a class="kpi" href="#/items?f=flips"><div class="v num">${money(tied, { whole: true })}</div><div class="l">Cash tied up in unsold stock</div></a>
        <a class="kpi" href="#/items?f=sold"><div class="v num">${soldMonth}</div><div class="l">Sold this month</div></a>
      </div>
      ${busiest ? `<section class="card section" aria-labelledby="h-rep">
        <div class="spread"><h2 id="h-rep">${esc(pname(busiest.platform))} in ${year}</h2>${statusBadge(busiest.report)}</div>
        <p class="small muted">Your busiest platform. ${esc(logicLine())}</p>
        ${limitBars(busiest)}
        <a class="btn secondary sm" href="#/tax">See every platform</a></section>` : ''}
      <section class="section" aria-labelledby="h-recent"><h2 id="h-recent">Recent changes</h2><ul class="list">${recent.map(r => r.html).join('')}</ul></section>` };
  },

  items(r) {

  },

  item(r) {

    steps.push(`<li class="done"><span class="dot"></span><b>Bought</b> ${fmtDate(i.boughtAt, true)}<div class="small muted">${esc(i.source || '')}${i.kind === 'wardrobe' ? '' : ' · paid ' + money(i.cost)}${i.haulId ? ' · part of a haul' : ''}</div></li>`);

         <div class="kpi"><div class="v num">${dts == null ? '—' : dts}</div><div class="l">Days to sell</div></div>
         <div class="kpi"><div class="v num">${money(fee)}</div><div class="l">Platform fee${i.sale.feeManual ? ' (typed in)' : ''}</div></div></div>`) : '';

    const breakdown = i.status === 'sold' ? `<section class="card section"><h2>How the money adds up</h2><table class="tbl num">

      <tr><td>Platform fee</td><td class="num">− ${money(fee)}</td></tr>
      ${Number(i.sale.postagePaid) ? `<tr><td>${esc(w.Postage)} you paid</td><td class="num">− ${money(i.sale.postagePaid)}</td></tr>` : ''}
      ${i.kind === 'wardrobe' ? `<tr class="total"><td>Money received</td><td class="num">${money(moneyIn(i, s))}</td></tr>`
        : `<tr><td>What you paid</td><td class="num">− ${money(i.cost)}</td></tr><tr class="total"><td>Profit after fees</td><td class="num">${money(p)}</td></tr>`}
      </table></section>` : '';

    const details = [['Category', i.category], ['Size', i.size], ['Brand', i.brand], ['Bin', i.bin], ['Notes', i.notes]].filter(x => x[1]);
    return { title: i.code, back: '#/items', html: `
      <div class="spread" style="align-items:flex-start"><div><h1>${esc(i.name)}</h1>

      <div class="btns">

        ${i.status === 'sold' ? `<button type="button" class="btn secondary" data-act="unsell" data-id="${esc(i.id)}">Not sold after all</button>` : ''}
        ${i.status === 'kept' || i.status === 'donated' ? `<button type="button" class="btn secondary" data-act="relist" data-id="${esc(i.id)}">Back to stock</button>` : ''}

      </div>` };

  tax() {
    const s = S.settings, w = W(), c = C();
    const items = itemsLive();
    const years = Array.from(new Set(items.filter(i => i.sale).map(i => +i.sale.date.slice(0, 4)).concat([new Date().getFullYear()]))).sort((a, b) => b - a);
    const ry = UI.repYear && years.includes(UI.repYear) ? UI.repYear : years[0];
    const rows = platformYear(items, s, ry);
    const mode = s.taxYear === 'uk' ? 'uk' : 'calendar';
    const tyears = Array.from(new Set(items.filter(i => i.sale).map(i => taxYearOf(mode, i.sale.date)).concat([taxYearOf(mode, todayISO())]))).sort((a, b) => b - a);
    const ty = UI.taxYear != null && tyears.includes(UI.taxYear) ? UI.taxYear : tyears[0];
    const range = taxYearRange(mode, ty);
    const y = yearSummary(S, range);
    const f = y.flips;
    const calm = `<div class="calm-note" role="note">Being reported doesn’t mean you owe tax. This is a record of your sales, not tax advice. If you’re unsure, ask an accountant or your tax office.</div>`;

    const repCards = rows.length ? rows.map(r => `<div class="card">
        <div class="spread"><h3 style="margin:0">${esc(pname(r.platform))}</h3>${statusBadge(r.report)}</div>

      : `<div class="card empty">No sales in ${ry} yet.</div>`;

    const rvm = rows.map(r => `<div class="card"><h3>${esc(pname(r.platform))}</h3><table class="tbl">
        <tr><td><b>Total sales on ${esc(pname(r.platform))}</b><div class="small muted">What the platform sees</div></td><td class="num"><b>${money(r.total)}</b><div class="small muted">${plural(r.count, 'sale')}</div></td></tr>

        <tr class="sub"><td> ${esc(w.Postage)} you paid</td><td class="num">− ${money(r.flips.postage)}</td></tr>
        <tr class="total"><td>What you made on flips</td><td class="num">${money(r.flips.profit)}</td></tr></table></div>`).join('');

    let lines = '';
    const L = (label, v, cls = '') => `<tr class="${cls}"><td>${label}</td><td class="num">${money(v)}</td></tr>`;
    if (s.country === 'US') {
      lines = L('Gross receipts <span class="small muted">(sales + shipping charged)</span>', f.sales)
        + L('Cost of goods sold', f.cogs) + L('Gross profit', round2(f.sales - f.cogs), 'head')
        + '<tr class="head"><td colspan="2">Expenses</td></tr>'
        + L('Commissions and fees', f.fees, 'sub') + L('Shipping paid', f.postage, 'sub')
        + f.byCat.filter(b => b.total).map(b => L(esc(b.name), b.total, 'sub')).join('')
        + L(`Car mileage (${f.mileageDistance} ${esc(s.distanceUnit)})`, f.mileageAmount, 'sub')
        + L('Profit after all costs', f.profit, 'total');
    } else {
      lines = L(s.country === 'UK' ? 'Turnover <span class="small muted">(sales + ' + esc(w.postage) + ' charged)</span>' : 'Income from sales', f.sales)
        + `<tr class="head"><td colspan="2">${s.country === 'UK' ? 'Allowable expenses' : 'Expenses'}</td></tr>`
        + L('Cost of items sold', f.cogs, 'sub') + L('Platform fees', f.fees, 'sub') + L(esc(w.Postage) + ' paid', f.postage, 'sub')
        + f.byCat.filter(b => b.total).map(b => L(esc(b.name), b.total, 'sub')).join('')
        + L(`Mileage (${f.mileageDistance} ${esc(s.distanceUnit)})`, f.mileageAmount, 'sub')
        + L(s.country === 'UK' ? 'Total allowable expenses' : 'Total expenses', f.totalExpenses)
        + L('Profit after all costs', f.profit, 'total');
    }
    const ukNote = s.country === 'UK' ? `<p class="small" style="margin-top:12px"><b>For information:</b> the trading allowance is ${money(1000, { whole: true })}. Your actual expenses this year are ${money(f.totalExpenses)}. ${f.totalExpenses >= 1000 ? 'Your actual expenses are higher than the allowance.' : 'The allowance is higher than your actual expenses.'} You can’t use both, so ask your accountant which suits you.</p>` : '';
    const yearOpts = tyears.map(t => `<option value="${t}" ${t === ty ? 'selected' : ''}>${esc(taxYearRange(mode, t).label)}</option>`).join('');

    return { title: 'Tax', html: `
      <h1>Tax</h1>
      ${calm}
      <section class="section" aria-labelledby="h-rc">
        <div class="spread"><h2 id="h-rc">Reporting check</h2>
          <label><span class="sr-only">Calendar year</span><select data-act-change="rep-year" style="width:auto;min-height:44px">${years.map(yv => `<option ${yv === ry ? 'selected' : ''}>${yv}</option>`).join('')}</select></label></div>
        <p class="small">${esc(c.limitText)} <a href="#/settings">Change limits</a></p>
        <div class="stack">${repCards}</div>
      </section>
      ${rows.length ? `<section class="section" aria-labelledby="h-rvm"><h2 id="h-rvm">What was reported vs what you made</h2>
        <p class="small muted">The platform sees every sale. Your old clothes aren’t profit, so they’re shown apart from your flips.</p>
        <div class="stack">${rvm}</div></section>` : ''}
      <section class="section" id="print-area" aria-labelledby="h-ys">
        <div class="print-only"><h1>${esc(APP_TITLE)}: year summary</h1></div>
        <div class="spread"><h2 id="h-ys">Year summary</h2>
          <label class="no-print"><span class="sr-only">${esc(w.TaxYear)}</span><select data-act-change="tax-year" style="width:auto;min-height:44px">${yearOpts}</select></label></div>
        <p class="small muted">${esc(w.TaxYear)} ${esc(range.label)}: ${fmtDate(range.start, true)} to ${fmtDate(range.end, true)}. Records summary, not tax advice.</p>
        <div class="card"><h3>Flips</h3><p class="small muted">${plural(f.count, 'item')} sold</p><table class="tbl">${lines}</table>${ukNote}</div>
        <div class="card"><h3>Wardrobe clear-outs</h3><table class="tbl">${L(`Money received from ${plural(y.wardrobe.count, 'sale')}`, y.wardrobe.total)}</table>
          <p class="small muted" style="margin-top:8px">Selling your own used things for less than you paid usually isn’t taxable income, but rules differ. Keep this total handy in case you’re asked.</p></div>
        <div class="card"><h3>Unsold flip stock</h3><table class="tbl">${L(`At cost on ${fmtDate(range.end, true)} (${plural(y.unsold.count, 'item')})`, y.unsold.cost)}</table></div>
        <p class="small print-only">Records summary, not tax advice. Made ${fmtDate(todayISO(), true)}.</p>
      </section>
      <section class="section no-print" aria-labelledby="h-ex"><h2 id="h-ex">Send it to your accountant</h2>
        <div class="card"><p class="small">One spreadsheet with tabs for Summary, Items, Sales, Expenses, Mileage and Reporting check. It opens in Excel, Google Sheets and Numbers.</p>
        <div class="btns"><button type="button" class="btn" data-act="export-xlsx">Download for my accountant</button>
        <button type="button" class="btn secondary" data-act="export-csv">All items as .csv</button>
        <button type="button" class="btn secondary" data-act="print">Print or save as PDF</button></div></div>
      </section>
      ${calm}` };

      ${list.length ? `<ul class="list section">${list.map(e => `<li><a href="#" data-act="edit-expense" data-id="${esc(e.id)}"><div class="grow"><div class="name">${esc(e.what)}</div>

  mileage() {
    const range = currentTaxRange();

function itemListHtml() {
  const q = UI.itemsQuery.trim().toLowerCase();
  const f = UI.itemsFilter;
  const sd = S.settings.staleDays;
  let list = itemsLive().filter(i => {
    switch (f) {
      case 'tolist': return i.status === 'tolist';
      case 'listed': return i.status === 'listed';
      case 'sold': return i.status === 'sold';
      case 'kept': return i.status === 'kept' || i.status === 'donated';
      case 'wardrobe': return i.kind === 'wardrobe';
      case 'flips': return i.kind !== 'wardrobe';
      case 'stale': return isStale(i, sd);
      default: return true;
    }
  });
  if (q) list = list.filter(i => [i.name, i.brand, i.code, i.bin, i.notes].some(v => v && String(v).toLowerCase().includes(q)));
  list.sort((a, b) => (b.updatedAt || '').localeCompare(a.updatedAt || ''));
  if (!list.length) return `<div class="card empty">${q ? 'Nothing matches “' + esc(UI.itemsQuery) + '”.' : 'Nothing here yet.'}</div>`;
  return `<p class="small muted">${plural(list.length, 'item')}</p><ul class="list">${list.map(itemRow).join('')}</ul>`;
}

function recentSources() {
  const used = itemsLive().slice().sort((a, b) => (b.createdAt || '').localeCompare(a.createdAt || '')).map(i => i.source).filter(Boolean);
  const out = [];
  for (const s of used.concat(S.settings.sources)) if (!out.includes(s)) out.push(s);
  return out.slice(0, 8);
}
function wardrobeSource() { const l = C().sources; return l[l.length - 1]; }

function haulRow(r, k) {
  return `<div class="haul-row"><input type="text" name="hname" data-k="${k}" value="${esc(r.name)}" placeholder="Item ${k + 1}" aria-label="Item ${k + 1} name" autocomplete="off">

    <button type="button" class="iconbtn" data-act="haul-del-row" data-k="${k}" aria-label="Remove item ${k + 1}">${icon('x')}</button></div>`;
}

function formVal(f, name) { const el = f.elements[name]; return el ? (el.value != null ? el.value : '') : ''; }
function sourceVal(f) {
  const v = formVal(f, 'source');
  return v === '__other' ? formVal(f, 'sourceOther').trim() : v;
}

// Live previews while typing.
const LIVE = {
  item(f, e) {
    const kind = formVal(f, 'kind');
    if (e && e.target && e.target.name === 'kind') {
      // Picking wardrobe or flip moves "Where I got it" to match, unless she chose somewhere herself.
      const ws = wardrobeSource();
      const want = kind === 'wardrobe' ? ws : (recentSources().find(x => x !== ws) || '');
      const radios = Array.from(f.querySelectorAll('input[name=source]'));
      const target = radios.find(r => r.value === want);
      if (target) { target.checked = true; radios.forEach(r => r.closest('.chip').classList.toggle('on', r.checked)); }
    }
    const n = f.querySelector('.cost-note');
    if (n) n.textContent = kind === 'wardrobe' ? 'Leave blank for your own things.' : '';
    const other = f.elements.sourceOther;
    if (other) other.classList.toggle('hide', formVal(f, 'source') !== '__other');
  },
  haul(f) {
    const h = UI.haul;
    h.total = formVal(f, 'total');
    const other = f.elements.sourceOther;
    if (other) other.classList.toggle('hide', formVal(f, 'source') !== '__other');
    const total = toNum(h.total);
    const shares = h.rows.map(r => r.share);
    const next = h.locked.length ? rebalance(total, shares, h.locked) : splitCost(total, h.rows.length);
    next.forEach((v, k) => { h.rows[k].share = v; const el = f.querySelector(`input[name=hshare][data-k="${k}"]`); if (el && document.activeElement !== el) el.value = v ? v.toFixed(2) : ''; });
    const tot = round2(h.rows.reduce((t, r) => t + r.share, 0));
    const out = $('#haul-sum');
    if (out) out.innerHTML = total ? (Math.abs(tot - total) < 0.005 ? `${plural(h.rows.length, 'item')}, ${money(total)} in all.` : `<span class="neg">The shares add up to ${money(tot)}, not ${money(total)}.</span>`) : '';
  },
  sell(f) {
    const i = S.items.find(x => x.id === formVal(f, 'id'));
    const plat = formVal(f, 'platform');
    const preset = S.settings.fees[plat];
    const price = toNum(formVal(f, 'price')), ship = toNum(formVal(f, 'shippingCharged')), post = toNum(formVal(f, 'postagePaid'));
    const manual = f.elements.feeManual.checked;
    $('#fee-manual').classList.toggle('hide', !manual);
    const fee = manual ? toNum(formVal(f, 'fee')) : calcFee(price, ship, preset);
    $('#fee-out').textContent = money(fee);
    $('#fee-note').textContent = manual ? 'Using the fee you typed.' : (preset ? `Worked out from the ${pname(plat)} preset: ${preset.payer === 'buyer' ? 'the buyer pays it' : preset.pct + '%' + (preset.fixed ? ' + ' + money(preset.fixed) : '')}. An estimate.` : 'No preset for this platform.');
    const got = round2(price + ship - fee - post);
    const out = $('#sell-out');
    out.textContent = money(i.kind === 'wardrobe' ? got : round2(got - (Number(i.cost) || 0)));
  },
  mileage(f) {
    const v = round2(toNum(formVal(f, 'distance')) * toNum(formVal(f, 'rate')));
    $('#mi-out').textContent = money(v);
  },
  buy(f) {
    const b = UI.buy;
    ['price', 'postage', 'target', 'tag'].forEach(k => { b[k] = formVal(f, k); });
    b.platform = formVal(f, 'platform');
    const preset = S.settings.fees[b.platform];
    const price = toNum(b.price);
    const out = $('#buy-out');
    if (!price) { out.innerHTML = '<p class="muted">Type what you think it’ll sell for.</p>'; return; }
    const max = maxBuyPrice(price, preset, toNum(b.postage), toNum(b.target));
    const examples = [1, 2, 3, 5, 8, 10, 15, 20].filter(x => x < price);
    const tag = toNum(b.tag);
    out.innerHTML = `<div class="card" style="text-align:center"><div class="small muted">Pay no more than</div><div class="bigbuy num">${money(max)}</div>
      <div class="small">to make ${money(toNum(b.target))} profit after fees.</div></div>
      ${tag ? `<p class="section" style="text-align:center">At ${money(tag)} you’d make <b class="${profitAtPrice(price, preset, toNum(b.postage), tag) < 0 ? 'neg' : 'pos'}">${money(profitAtPrice(price, preset, toNum(b.postage), tag))}</b>.</p>` : ''}

      ${examples.map(x => { const p = profitAtPrice(price, preset, toNum(b.postage), x); return `<tr><td class="num" style="text-align:left">${money(x)}</td><td class="num ${p < 0 ? 'neg' : ''}">${money(p)}</td></tr>`; }).join('')}</table>`;
  },

  },
  sell(f) {

    const sale = { platform: formVal(f, 'platform'), price: round2(toNum(formVal(f, 'price'))), postagePaid: round2(toNum(formVal(f, 'postagePaid'))),
      shippingCharged: round2(toNum(formVal(f, 'shippingCharged'))), date: formVal(f, 'date') || todayISO(), feeManual: manual, fee: manual ? round2(toNum(formVal(f, 'fee'))) : 0 };
    closeSheet();
    commit(st => {
      const it = st.items.find(x => x.id === id);
      if (!it.listedAt) { it.listedAt = sale.date; it.listPlatform = sale.platform; }
      if (!sale.feeManual) sale.fee = calcFee(sale.price, sale.shippingCharged, st.settings.fees[sale.platform]);

  },

function finishOnboarding(sample) {
  const d = UI.onboard.data;
  if (sample) {
    S = makeSample(d.country);
    S.meta = { changes: 0, lastBackupAt: null, lastRemindAt: null, firstUseAt: nowISO() };
  } else {
    S = blankState(d.country);
  }
  S.settings.currency = d.currency;
  if (!sample) S.settings.platforms = d.platforms.length ? d.platforms : COUNTRIES[d.country].defaultPlatforms.slice();
  S.settings.onboarded = true;
  fmtCacheClear();
  persist();
  location.hash = '#/home';
  render();
}
function fmtCacheClear() { for (const k in fmtCache) delete fmtCache[k]; }

function applyTheme() {
  const t = S && S.settings.theme;
  if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
  else document.documentElement.removeAttribute('data-theme');
}

function stamp() { return todayISO(); }
function exportXlsx() {
  const range = currentTaxRange(UI.taxYear);
  const bytes = makeXlsx(buildWorkbook(S, range));
  downloadBlob(new Blob([bytes], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }), `reseller-tax-records-${range.label.replace('/', '-')}.xlsx`);
  toast('Spreadsheet downloaded');
}
function exportCsv() {
  downloadBlob(new Blob([makeCsv(itemRows(S))], { type: 'text/csv;charset=utf-8' }), `reseller-items-${stamp()}.csv`);
  toast('CSV downloaded');
}
async function saveBackup() {
  const blob = new Blob([JSON.stringify(makeBackup(S), null, 1)], { type: 'application/json' });
  const res = await shareOrDownload(blob, `reseller-tax-tracker-backup-${stamp()}.json`);
  if (res === 'shared' || res === 'downloaded') {
    S.meta = S.meta || {};
    S.meta.lastBackupAt = nowISO(); S.meta.changes = 0;
    persist(); render();
    toast(res === 'shared' ? 'Backup shared' : 'Backup saved to your downloads');
  }
}
function readBackupFile(input, boot) {
  const file = input.files && input.files[0];
  if (!file) return;
  const r = new FileReader();
  r.onload = () => {
    const res = readBackup(String(r.result));
    input.value = '';
    if (!res.ok) { toast(res.error); return; }
    if (boot || !S || !itemsLive().length) { applyImport(res.data, 'replace'); return; }
    openSheet('importPreview', { data: res.data });
  };
  r.onerror = () => toast('That file couldn’t be read. Try saving it again.');
  r.readAsText(file);
}
function applyImport(data, how) {
  const incoming = { settings: data.settings, items: data.items || [], expenses: data.expenses || [], mileage: data.mileage || [], nextCode: data.nextCode || 1 };
  closeSheet();
  if (!S || how === 'replace') {
    if (S) snapshot();
    const prevMeta = S && S.meta;
    S = { ...blankState((data.settings && data.settings.country) || 'US'), ...incoming };
    S.settings = { ...defaultSettings(S.settings.country || 'US'), ...(data.settings || {}), onboarded: true };
    S.sample = S.items.some(i => i.sample);
    S.meta = { ...(prevMeta || {}), changes: 0, firstUseAt: (prevMeta && prevMeta.firstUseAt) || nowISO(), lastBackupAt: nowISO() };
    BOOT.status = 'ok';
    fmtCacheClear(); applyTheme(); persist(); location.hash = '#/home'; render();
    toast(`Backup opened: ${plural(previewBackup(data).items, 'item')}`, S ? undo : null);
  } else {
    commit(st => { Object.assign(st, mergeStates(st, incoming)); }, `Merged: ${plural(previewBackup(data).items, 'item')} in the backup`);
  }
}

  'haul-del-row': t => {
    const f = $('form[data-form=haul]');
    if (UI.haul.rows.length <= 1) return;
    $$('input[name=hname]', f).forEach(el => { UI.haul.rows[+el.dataset.k].name = el.value; });
    const k = +t.dataset.k;
    UI.haul.rows.splice(k, 1);
    UI.haul.locked = UI.haul.locked.filter(x => x !== k).map(x => (x > k ? x - 1 : x));
    $('#haul-rows').innerHTML = UI.haul.rows.map((r, i) => haulRow(r, i)).join('');
    LIVE.haul(f);
  },
  filter: t => { UI.itemsFilter = t.dataset.f; $$('[data-act=filter]').forEach(b => b.setAttribute('aria-pressed', b === t)); $('#item-list').innerHTML = itemListHtml(); if (location.hash.includes('?')) history.replaceState(null, '', '#/items'); },
  'mark-listed': t => openSheet('list', { id: t.dataset.id }),
  'mark-sold': t => openSheet('sell', { id: t.dataset.id }),
  'edit-item': t => { const it = S.items.find(x => x.id === t.dataset.id); openSheet('add', { id: it.id, item: it }); },
  'keep-item': t => openSheet('keep', { id: t.dataset.id }),
  unsell: t => commit(st => { const it = st.items.find(x => x.id === t.dataset.id); it.sale = null; it.status = 'listed'; touch(it); }, 'Moved back to listed'),
  relist: t => commit(st => { const it = st.items.find(x => x.id === t.dataset.id); it.status = it.listedAt ? 'listed' : 'tolist'; touch(it); }, 'Back in stock'),
  'delete-item': t => { const id = t.dataset.id; go('#/items'); commit(st => { const it = st.items.find(x => x.id === id); it.deleted = true; touch(it); }, 'Item deleted'); },
  'add-expense': () => openSheet('expense', {}),
  'edit-expense': (t, e) => { e.preventDefault(); openSheet('expense', { id: t.dataset.id }); },
  'delete-expense': t => { closeSheet(); commit(st => { const x = st.expenses.find(r => r.id === t.dataset.id); x.deleted = true; touch(x); }, 'Expense deleted'); },
  'add-mileage': () => openSheet('mileage', {}),
  'edit-mileage': (t, e) => { e.preventDefault(); openSheet('mileage', { id: t.dataset.id }); },
  'delete-mileage': t => { closeSheet(); commit(st => { const x = st.mileage.find(r => r.id === t.dataset.id); x.deleted = true; touch(x); }, 'Trip deleted'); },
  'clear-sample': () => commit(st => {
    st.items = st.items.filter(i => !i.sample); st.expenses = st.expenses.filter(i => !i.sample); st.mileage = st.mileage.filter(i => !i.sample);
    st.sample = false; st.nextCode = st.items.reduce((m, i) => Math.max(m, parseInt(String(i.code).replace(/\D/g, ''), 10) || 0), 0) + 1;
    st.meta.changes = 0;
  }, 'Sample cleared. Your shop is ready.', { quiet: true }),
  'load-sample': () => commit(st => {
    const smp = makeSample(st.settings.country);
    st.items = st.items.concat(smp.items); st.expenses = st.expenses.concat(smp.expenses); st.mileage = st.mileage.concat(smp.mileage);
    st.sample = true; st.nextCode = Math.max(st.nextCode || 1, smp.nextCode);
  }, 'Sample shop loaded', { quiet: true }),
  'snooze-backup': () => { S.meta.lastRemindAt = nowISO(); S.meta.changes = 0; persist(); render(); },
  'save-backup': () => saveBackup(),
  'import-merge': () => applyImport(UI.sheet.data.data, 'merge'),
  'import-replace': () => applyImport(UI.sheet.data.data, 'replace'),
  'export-xlsx': () => exportXlsx(),
  'export-csv': () => exportCsv(),
  print: () => { document.body.classList.add('printing'); setTimeout(() => { window.print(); setTimeout(() => document.body.classList.remove('printing'), 500); }, 50); },
  'toggle-platform': t => commit(st => {
    const p = t.dataset.p, list = st.settings.platforms;
    st.settings.platforms = list.includes(p) ? list.filter(x => x !== p) : list.concat(p);
    if (!st.settings.fees[p]) st.settings.fees[p] = defaultFees(st.settings.country)[p];
  }, null, { quiet: true }),
  'reset-fees': () => commit(st => { st.settings.fees = defaultFees(st.settings.country); }, 'Fees put back to the starting estimates'),
  'ob-back': () => { UI.onboard.step = Math.max(0, UI.onboard.step - 1); render(); },
  'ob-finish': t => finishOnboarding(t.dataset.sample === '1'),
  'start-fresh': () => { S = blankState('US'); BOOT.status = 'ok'; UI.onboard = { step: 0 }; render(); },
};

// Settings fields save on change.
function applySetting(el) {
  const key = el.dataset.set;
  const v = el.value;
  commit(st => {
    const s = st.settings;
    if (key === 'country') {
      const keepPlatforms = s.platforms;
      const d = defaultSettings(v);
      Object.assign(s, { country: v, currency: d.currency, fees: d.fees, limits: d.limits, taxYear: d.taxYear, distanceUnit: d.distanceUnit, mileageRate: d.mileageRate, sizes: d.sizes });
      s.platforms = keepPlatforms;
      fmtCacheClear();
    } else if (key === 'currency') { s.currency = v; fmtCacheClear(); }
    else if (key === 'taxYear' || key === 'theme' || key === 'distanceUnit') s[key] = v;
    else if (key.startsWith('num:')) s[key.slice(4)] = Math.max(0, toNum(v));
    else if (key.startsWith('limit:')) { const k = key.slice(6); s.limits[k] = k === 'logic' ? v : Math.max(1, toNum(v)); if (k === 'logic') s.limits.strict = v === 'both'; }
    else if (key.startsWith('list:')) s[key.slice(5)] = v.split('\n').map(x => x.trim()).filter(Boolean);
    else if (key.startsWith('fee:')) {
      const [, p, field] = key.split(':');
      s.fees[p] = s.fees[p] || { pct: 0, fixed: 0, payer: 'seller' };
      s.fees[p][field] = field === 'payer' ? v : Math.max(0, toNum(v));
    }
  }, 'Saved', { quiet: true, noRender: !['country', 'currency', 'theme', 'distanceUnit', 'limit:logic'].includes(key) });
  applyTheme();
}

// ---- app/boot.js ----
// Start-up and event wiring.

UI.navCount = 0;

document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (!t || t.tagName === 'SELECT' || t.tagName === 'INPUT' && t.type === 'file') return;
  const fn = ACT[t.dataset.act];
  if (fn) { fn(t, e); }
});

document.addEventListener('submit', e => {
  const f = e.target;
  const fn = FORM[f.dataset.form];
  if (fn) { e.preventDefault(); fn(f); }
});

document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'item-search') { UI.itemsQuery = t.value; $('#item-list').innerHTML = itemListHtml(); return; }
  const f = t.form;
  if (f && f.dataset.form === 'haul' && t.name === 'hshare') {
    const k = +t.dataset.k;
    UI.haul.rows[k].share = round2(toNum(t.value));
    if (!UI.haul.locked.includes(k)) UI.haul.locked.push(k);
    if (UI.haul.locked.length >= UI.haul.rows.length) UI.haul.locked = [k];
  }
  if (f && f.dataset.live && LIVE[f.dataset.live]) LIVE[f.dataset.live](f);
});

document.addEventListener('change', e => {
  const t = e.target;
  // Chip-style radios and checkboxes show their state with a class.
  if (t.matches('.chip input')) {
    $$(`input[name="${t.name}"]`, t.form || document).forEach(x => x.closest('.chip').classList.toggle('on', x.checked));
  }
  if (t.form && t.form.dataset.live && LIVE[t.form.dataset.live]) LIVE[t.form.dataset.live](t.form, e);
  if (t.dataset.set) { applySetting(t); return; }
  const act = t.dataset.actChange;
  if (act === 'rep-year') { UI.repYear = +t.value; render(); }
  else if (act === 'tax-year') { UI.taxYear = +t.value; render(); }
  else if (act === 'open-backup') readBackupFile(t, false);
  else if (act === 'open-backup-boot') readBackupFile(t, true);
  else if (act === 'demo-country') { S = makeSample(t.value); S.meta = { changes: 0 }; fmtCacheClear(); render(); }
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && UI.sheet) { closeSheet(); return; }
  if (e.key === 'Tab' && UI.sheet) {
    const box = $('#overlay .sheet');
    if (!box) return;
    const f = $$('a[href], button:not([disabled]), input:not([type=hidden]):not(.sr-only), select, textarea, summary, label.btn', box).filter(x => x.offsetParent !== null);
    if (!f.length) return;
    const first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }
});

window.addEventListener('hashchange', () => {
  UI.navCount++;
  if (UI.sheet) closeSheet();
  render();
  window.scrollTo(0, 0);
  focusMain();
});

if (window.matchMedia) {
  try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => applyTheme()); } catch (e) { /* old browsers */ }
}

async function boot() {
  const params = new URLSearchParams(location.search);
  const demo = params.get('demo') === '1';
  const res = await Store.init(demo);
  BOOT.status = res.status;
  if (demo) {
    const c = (params.get('country') || 'UK').toUpperCase();
    S = makeSample(COUNTRIES[c] ? c : 'UK');
    S.meta = { changes: 0 };
  } else if (res.state) {
    S = res.state;
    S.settings = { ...defaultSettings(S.settings && S.settings.country || 'US'), ...(S.settings || {}) };
    S.items = S.items || []; S.expenses = S.expenses || []; S.mileage = S.mileage || [];
    ensureMeta();
  } else if (res.status === 'cleared') {
    S = null;
  } else {
    S = blankState('US');
    if (res.status === 'unavailable') BOOT.status = 'unavailable';
  }
  applyTheme();
  render();
  focusMain();
}

if (BUILD === 'web' && 'serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => { /* offline support is a bonus */ }); });
}

boot();

})();
</script>
